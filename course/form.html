<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Login Form</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #070707;
        padding: 20px;
      }

      a{
        color: white;
        text-decoration: none;
      }
      .login-container {
        display: flex;
        width: 900px;
        height: 600px;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        overflow: hidden;
      }

      /* --- Left Side: Graphics --- */
      .illustration-side {
        flex: 1;
        background-color: #f7ede2;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        overflow: hidden;
        padding-bottom: 60px;
      }

      .character-group {
        position: relative;
        width: 300px;
        height: 300px;
      }

      .character {
        position: absolute;
        display: flex;
        justify-content: center;
        animation: float 6s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      .character:nth-child(2) { animation-delay: -2s; }
      .character:nth-child(3) { animation-delay: -4s; }
      .character:nth-child(4) { animation-delay: -1s; }

      .eyes {
        display: flex;
        gap: 8px;
        position: absolute;
        top: 25px;
      }

      .eye {
        width: 8px;
        height: 8px;
        background-color: #000;
        border-radius: 50%;
        position: relative;
        transition: height 0.15s ease, margin-top 0.15s ease, border-radius 0.15s ease;
      }

      .eye::after {
        content: '';
        position: absolute;
        width: 3px;
        height: 3px;
        background: #fff;
        border-radius: 50%;
        top: 1px;
        left: 1px;
        transition: transform 0.1s linear;
      }

      .black-drop .eye {
        background-color: #fff;
      }
      .black-drop .eye::after {
        background: #2c3e50;
      }

      /* Closed/squinting state */
      .password-focused .eye {
        height: 2px;
        border-radius: 0;
        margin-top: 3px;
        animation: none;
      }
      .password-focused .eye::after {
        opacity: 0;
      }

      /* Blinking animation */
      @keyframes blink {
        0%, 96%, 100% { height: 8px; }
        98% { height: 1px; }
      }
      .eye {
        animation: blink 4s infinite;
      }
      .password-focused .eye {
        animation: none;
      }

      .orange-blob {
        width: 140px;
        height: 90px;
        background-color: #f28482;
        border-top-left-radius: 70px;
        border-top-right-radius: 70px;
        bottom: 0;
        left: 10px;
        z-index: 2;
      }

      .purple-block {
        width: 100px;
        height: 240px;
        background-color: #845ec2;
        border-top-left-radius: 50px;
        border-top-right-radius: 50px;
        bottom: 0;
        left: 110px;
        z-index: 1;
      }

      .yellow-curve {
        width: 90px;
        height: 90px;
        background-color: #7da2ec;
        border-radius: 50%;
        bottom: 0;
        right: 10px;
        z-index: 2;
        clip-path: inset(0 0 45px 0);
      }

      .yellow-curve .eyes { top: 15px; }

      .black-drop {
        width: 80px;
        height: 160px;
        background-color: #2c3e50;
        border-radius: 40px;
        top: -200px;
        left: 80px;
        z-index: 3;
        animation: dropIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, float 6s ease-in-out infinite 1.2s;
        animation-delay: 0.5s;
      }

      .black-drop .eyes { top: 110px; }

      @keyframes dropIn {
        to { top: -40px; }
      }

      /* --- Right Side: Form --- */
      .form-side {
        flex: 1;
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .form-header {
        margin-bottom: 30px;
        position: relative;
      }

      .plus-icon {
        position: absolute;
        top: -20px;
        left: 0;
        font-size: 24px;
        color: #000;
        font-weight: 300;
      }

      .form-header h2 {
        font-size: 28px;
        color: #111827;
        margin-bottom: 6px;
      }

      .form-header p {
        color: #6b7280;
        font-size: 14px;
      }

      .input-group {
        margin-bottom: 20px;
      }

      .input-group label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: #374151;
        margin-bottom: 6px;
      }

      .input-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .input-group input:focus {
        border-color: #845ec2;
        box-shadow: 0 0 0 3px rgba(132, 94, 194, 0.1);
      }

      .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .password-wrapper i {
        position: absolute;
        right: 16px;
        color: #9ca3af;
        cursor: pointer;
        transition: color 0.2s;
      }
      .password-wrapper i:hover {
        color: #374151;
      }

      .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        margin-bottom: 24px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        color: #374151;
      }

      .remember-me input { accent-color: #845ec2; }

      .forgot-pass {
        color: #845ec2;
        text-decoration: none;
        font-weight: 500;
      }

      .forgot-pass:hover { text-decoration: underline; }

      .btn {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        transition: all 0.2s;
        margin-bottom: 12px;
        border: none;
      }

      .btn-primary {
        background-color: #000;
        color: #fff;
      }

      .btn-primary:hover {
        background-color: #222;
        transform: translateY(-1px);
      }

      .btn-primary:active { transform: translateY(0); }

      .btn-secondary {
        background-color: #fff;
        color: #374151;
        border: 1px solid #d1d5db;
      }

      .btn-secondary:hover {
        background-color: #f9fafb;
        transform: translateY(-1px);
      }

      .signup-text {
        text-align: center;
        font-size: 14px;
        color: #6b7280;
        margin-top: 10px;
      }

      .signup-text a {
        color: #845ec2;
        text-decoration: none;
        font-weight: 600;
      }
      

      /* Responsive */
      @media (max-width: 768px) {
        .login-container {
          flex-direction: column;
          height: auto;
          width: 100%;
          max-width: 450px;
        }
        .illustration-side {
          height: 200px;
          padding-bottom: 20px;
        }
        .character-group {
          transform: scale(0.6);
        }
        .form-side { padding: 40px 24px; }
      }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  
    <div class="login-container">
        <div class="illustration-side">
            <div class="character-group">
                <div class="character orange-blob">
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    
                </div>
                <div class="character purple-block">
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                </div>
                <div class="character yellow-curve">
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                </div>
                <div class="character black-drop">
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-side">
            <h1 style="color:black; text-align: end;">Qubby</h1>
            <div class="form-header">
              
                <h2>Welcome back!</h2>
                <p>Please enter your details</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>

                <div class="input-group password-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="••••••••">
                        <i class="fa-regular fa-eye-slash" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>Remember for 30 days</span>
                    </label>
                    <a href="#" class="forgot-pass">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary">
                  <a href="page2.html">Log in</a></button>
                <button type="button" class="btn btn-secondary">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_Logo.svg" alt="Google Logo" width="18">
                    Log in with Google
                </button>
            </form>

            <p class="signup-text">Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </div>

    <script>
      const togglePassword = document.querySelector('#togglePassword');
      const passwordInput = document.querySelector('#password');
      const emailInput = document.querySelector('#email');
      const loginContainer = document.querySelector('.login-container');
      const eyes = document.querySelectorAll('.eye');

      // Toggle password visibility
      togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
      });

      // Password focus = close eyes
      let isPasswordFocused = false;
      passwordInput.addEventListener('focus', () => {
        isPasswordFocused = true;
        loginContainer.classList.add('password-focused');
      });

      passwordInput.addEventListener('blur', () => {
        isPasswordFocused = false;
        loginContainer.classList.remove('password-focused');
      });

      // Improved eye tracking with smooth movement + pupil highlights
      let mouseX = 0, mouseY = 0;
      let currentX = 0, currentY = 0;

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      function animateEyes() {
        if (!isPasswordFocused) {
          // Smooth lerp for less jittery movement
          currentX += (mouseX - currentX) * 0.1;
          currentY += (mouseY - currentY) * 0.1;

          eyes.forEach((eye) => {
            const rect = eye.getBoundingClientRect();
            const eyeX = rect.left + rect.width / 2;
            const eyeY = rect.top + rect.height / 2;
           
            const angle = Math.atan2(currentY - eyeY, currentX - eyeX);
            const distance = Math.min(2.5, Math.hypot(currentX - eyeX, currentY - eyeY) / 50);
           
            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;
           
            eye.style.transform = `translate(${moveX}px, ${moveY}px)`;
          });
        }
        requestAnimationFrame(animateEyes);
      }
      animateEyes();

      // Eyes follow email input when typing
      emailInput.addEventListener('focus', () => {
        if (!isPasswordFocused) {
          const rect = emailInput.getBoundingClientRect();
          mouseX = rect.left + rect.width / 2;
          mouseY = rect.top + rect.height / 2;
        }
      });

      // Form submission
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = this.querySelector('.btn-primary');
        btn.textContent = 'Logging in...';
        btn.style.opacity = '0.7';
        setTimeout(() => {
          btn.textContent = 'Log in';
          btn.style.opacity = '1';
          alert('Form submitted successfully!');
        }, 800);
        
      });
    </script>
</body>
</html>
