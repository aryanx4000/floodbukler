<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scroll Rolling Cards</title>
    <style>
      * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: #0f0f12;
    font-family: system-ui, sans-serif;
    color: #fff;

}

/* Outer container to view the 3D space */
.scroll-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px; /* Gives depth to the wheel */
}

/* The vertical track holding the cards */
.card-track {
    position: relative;
    width: 300px;
    height: 400px;
    transform-style: preserve-3d;
    will-change: transform;
}

/* Individual Card Styling */
.card {
    position: absolute;
    width: 200px; /* Adjusted slightly smaller for horizontal layout fit */
    height: 280px;
    top: 0;
    left: 50%;
    margin-left: -100px; /* Center perfectly on the track's vertical axis (half of width) */
    background: linear-gradient(135deg, #2c3e50, #3498db);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
   
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
   
    backface-visibility: hidden;
    transition: transform 0.1s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.1s linear;
}


.card h3 {
    margin-bottom: 8px;
    font-size: 1.5rem;
}

.card p {
    color: #cbd5e1;
    font-size: 0.9rem;
}

    </style>
</head>
<body>

    <div class="scroll-container">
        <div class="card-track">
            <div class="card"><h3>Card One</h3><p>Scroll down to roll</p></div>
            <div class="card"><h3>Card Two</h3><p>Keep going...</p></div>
            <div class="card"><h3>Card Three</h3><p>Smooth 3D motion</p></div>
            <div class="card"><h3>Card Four</h3><p>CSS & JS powered</p></div>
            <div class="card"><h3>Card Five</h3><p>Almost at the end</p></div>
            <div class="card"><h3>Card Six</h3><p>The Final Card</p></div>
        </div>
    </div>

    <script>
        const track = document.querySelector('.card-track');
        const cards = document.querySelectorAll('.card');

        let currentScroll = 0;
        let targetScroll = 0;
        const scrollSpeed = 0.2;

        const angleStep = 60;
        const radius = 360;

        function updateCards() {
            currentScroll += (targetScroll - currentScroll) * 0.1;
        
            cards.forEach((card, index) => {
                const cardAngle = (index * angleStep) - currentScroll;
                const radians = (cardAngle * Math.PI) / 180;
                const opacity = Math.max(0, Math.cos(radians));
            
                // CHANGED: Use rotateY instead of rotateX
                card.style.transform = `rotateY(${cardAngle}deg) translateZ(${radius}px)`;
                card.style.opacity = opacity;
            });
        
            requestAnimationFrame(updateCards);
        }

        // Mouse wheel logic remains the same
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            targetScroll += e.deltaY * scrollSpeed;
        }, { passive: false });

        // Mobile Touch logic (Changed from tracking deltaY to deltaX for horizontal natural feel)
        let startX = 0;
        window.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const currentX = e.touches[0].clientX;
            const deltaX = startX - currentX;
            targetScroll += deltaX * 0.4;
            startX = currentX;
        }, { passive: true });

        updateCards();

    </script>
</body>
</html>
